<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/images/spx-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>LogiSync — SPX Express Parcel Verification</title>
    <script>
      (function () {
        try {
          var uid = null;
          var rawUser = localStorage.getItem("user");
          if (rawUser) {
            var u = JSON.parse(rawUser);
            if (u && u.user_id) uid = String(u.user_id);
          }
          var rawPrefs = (uid && localStorage.getItem("pt-prefs-u:" + uid)) || localStorage.getItem("pt-prefs");
          var prefs = rawPrefs ? JSON.parse(rawPrefs) : null;
          var isDark = false;
          if (prefs && prefs.themeMode === "system") {
            isDark = Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          } else if (prefs && typeof prefs.dark === "boolean") {
            isDark = prefs.dark;
          } else {
            isDark = localStorage.getItem("darkMode") === "enabled";
          }
          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
