
name: Update Backend Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update package-lock.json
        working-directory: Logisync/Backend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- Logisync/Backend/package-lock.json; then
            echo "No lockfile changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Logisync/Backend/package-lock.json
          git commit -m "Update backend package lockfile"
          git push
